&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Four-channel faceplate using the full Salamis Tablet layout</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A rectangular faceplate divided by an irregular crack line. Above the crack sits a five-rule group standing in for the control strip, with a vertical divider and a downward semicircle. Below sits four horizontal scrub pads with a vertical divider, an upward semicircle at the top pad, eleven tick divisions per pad with crosses at the third, sixth and ninth, and Greek acrophonic numerals along the left, right and bottom margins.</desc>
