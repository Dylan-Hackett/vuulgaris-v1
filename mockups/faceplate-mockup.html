<script>
(function(){
  var NS="http://www.w3.org/2000/svg";
  var g=document.getElementById("pads");
  var X0=112, L=456, N=60, H=31, GAP=0.5;
  var pitch=L/N, w=pitch-0.55;
  var col=["#1D9E75","#7F77DD","#D85A30","#D4537E"];
  function box(x,y,h,c){
    if(h<0.18) return;
    var r=document.createElementNS(NS,"rect");
    r.setAttribute("x",x.toFixed(2));
    r.setAttribute("y",y.toFixed(2));
    r.setAttribute("width",w.toFixed(2));
    r.setAttribute("height",h.toFixed(2));
    r.setAttribute("fill",c);
    r.setAttribute("opacity","0.88");
    g.appendChild(r);
  }
  for(var p=0;p<4;p++){
    var y0=120+46*p;
    for(var k=0;k<N;k++){
      var t=3*k/(N-1);
      var e1=Math.max(0,1-t);
      var e2=Math.max(0,1-Math.abs(t-1));
      var e3=Math.max(0,1-Math.abs(t-2));
      var e4=Math.max(0,t-2);
      var topV, topC, botV, botC;
      if(t<=1){ topV=e1; topC=col[0]; botV=e2; botC=col[1]; }
      else if(t<=2){ topV=e3; topC=col[2]; botV=e2; botC=col[1]; }
      else { topV=e3; topC=col[2]; botV=e4; botC=col[3]; }
      var ht=H*topV, hb=H*botV;
      var x=X0+k*pitch;
      box(x, y0, ht-GAP/2, topC);
      box(x, y0+ht+GAP/2, hb-GAP/2, botC);
    }
  }
})();
</script>
