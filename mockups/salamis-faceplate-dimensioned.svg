<svg width="100%" viewBox="0 0 680 392" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Vuulgaris V1 faceplate, Salamis Tablet layout, dimensioned at 298 x 154mm</title>
<desc>The Salamis Tablet faceplate drawn to scale at the 6mm inter-pad gap working proposal, 298 by 154mm at 1.946 pixels per millimetre. Above the crack line, twelve potentiometers stand on the second and fourth of five ruled lines: eight channel pots in a four by two grid left of the vertical divider, four envelope pots in a two by two grid right of it. The encoder and two switches sit beside them and the OLED is at the right end. Below the crack, four 216mm scrub pads 12mm wide at 18mm pitch, with a vertical divider, upward semicircle, eleven tick divisions per pad, crosses at the third, sixth and ninth, and Greek acrophonic numerals in the left, right and bottom margins.</desc>

